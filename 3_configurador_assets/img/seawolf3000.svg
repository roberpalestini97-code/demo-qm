<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="340" fill="#eef1f5"/>
  <!-- trailer chassis -->
  <rect x="40" y="228" width="700" height="18" fill="#2b2f36"/>
  <rect x="610" y="200" width="150" height="30" fill="#2b2f36"/>
  <!-- wheels -->
  <g fill="#1b1d21"><circle cx="560" cy="262" r="26"/><circle cx="620" cy="262" r="26"/><circle cx="680" cy="262" r="26"/></g>
  <g fill="#8a9099"><circle cx="560" cy="262" r="10"/><circle cx="620" cy="262" r="10"/><circle cx="680" cy="262" r="10"/></g>
  <rect x="80" y="246" width="10" height="40" fill="#2b2f36"/><rect x="66" y="284" width="38" height="8" fill="#2b2f36"/>
  <!-- radiator -->
  <rect x="60" y="92" width="90" height="136" rx="4" fill="#c8102e"/>
  <g stroke="#7d0a1d" stroke-width="3"><line x1="72" y1="108" x2="138" y2="108"/><line x1="72" y1="124" x2="138" y2="124"/><line x1="72" y1="140" x2="138" y2="140"/><line x1="72" y1="156" x2="138" y2="156"/><line x1="72" y1="172" x2="138" y2="172"/><line x1="72" y1="188" x2="138" y2="188"/><line x1="72" y1="204" x2="138" y2="204"/></g>
  <!-- engine -->
  <rect x="160" y="118" width="190" height="110" rx="6" fill="#c8102e"/>
  <rect x="175" y="96" width="160" height="26" rx="4" fill="#a00d25"/>
  <rect x="300" y="60" width="16" height="40" fill="#555b64"/>
  <!-- transmission -->
  <rect x="360" y="138" width="80" height="90" rx="6" fill="#3d434c"/>
  <rect x="440" y="170" width="40" height="18" fill="#8a9099"/>
  <!-- pump -->
  <rect x="480" y="128" width="130" height="100" rx="6" fill="#d9dde3" stroke="#2b2f36" stroke-width="3"/>
  <rect x="610" y="146" width="60" height="64" rx="4" fill="#9aa1ab" stroke="#2b2f36" stroke-width="3"/>
  <g fill="#2b2f36"><rect x="620" y="152" width="40" height="8"/><rect x="620" y="166" width="40" height="8"/><rect x="620" y="180" width="40" height="8"/><rect x="620" y="194" width="40" height="8"/></g>
  <path d="M670 178 h60 v-40 h20" stroke="#2b2f36" stroke-width="8" fill="none"/>
  <!-- labels -->
  <text x="40" y="36" font-size="22" font-weight="700" fill="#14181f">Seawolf 3000 · Diésel</text>
  <text x="40" y="58" font-size="13" fill="#5b6472">Ilustración esquemática · motor · transmisión · bomba quintuplex</text>
  <g font-size="12" fill="#14181f" text-anchor="middle">
    <text x="255" y="320">Motor</text><text x="400" y="320">Transmisión</text><text x="575" y="320">Bomba</text>
  </g>
</svg>
