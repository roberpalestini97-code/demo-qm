# ElasticMQ: SQS compatible para desarrollo local. Mismas colas que crea el CDK.
include classpath("application.conf")

node-address {
  protocol = http
  host = sqs
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  telemetria {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "telemetria-dlq"
      maxReceiveCount = 5
    }
  }
  telemetria-dlq {}
}
